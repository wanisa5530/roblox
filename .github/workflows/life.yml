name: Life Story
on:
  push: { paths: ["life-story/**", ".github/workflows/life.yml"] }
  workflow_dispatch:
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luau + rojo
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip && unzip -qo luau.zip -d /usr/local/bin
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip && unzip -qo rojo.zip -d /usr/local/bin
      - name: Lint
        working-directory: life-story
        run: |
          set -e
          for f in $(find src -name '*.lua'); do
            luau-analyze "$f" 2>&1 | grep -iv "Unknown global\|Unknown type\|unknown require\|TypeError\|ImplicitReturn\|SameLineStatement\|ImportUnused\|^$" | grep -q . && { luau-analyze "$f"; exit 1; } || true
          done
      - name: Build place
        working-directory: life-story
        run: rojo build -o LifeStory.rbxlx
  cloud-test:
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ secrets.LIFE_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ secrets.LIFE_PLACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build place
        working-directory: life-story
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip && unzip -qo rojo.zip -d /usr/local/bin
          rojo build -o LifeStory.rbxlx
      - name: Publish place to Roblox
        run: python3 scripts/publish_place.py life-story/LifeStory.rbxlx
      - name: Smoke test
        run: python3 scripts/run_luau_test.py life-story/tests/smoke.luau
      - name: Life simulation test
        run: python3 scripts/run_luau_test.py life-story/tests/sim.luau
